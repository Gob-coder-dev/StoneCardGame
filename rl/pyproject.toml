[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samstone-rl"
version = "0.1.0"
description = "Entraînement des boss par renforcement pour SamStone"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
samstone-train = "samstone_rl.training.ppo_cleanrl:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "mypy>=1.13.0"]
directml = ["torch-directml>=0.2.0.dev240914"]
monitoring = ["wandb>=0.16.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

