  medium_games_per_side_order: 20 # 480 matchs par deck
  final_games_per_side_order: 100 # 2 400 matchs par deck
  short_seed_base: 2200000000
  medium_seed_base: 2210000000
  final_seed_base: 2220000000
  medium_finalists: 12
  final_finalists: 3

