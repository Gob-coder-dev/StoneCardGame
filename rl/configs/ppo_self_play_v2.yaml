# Phase 5: start only from a validated phase-4 checkpoint.
# The decks below are fixed presets. Training pairs different gods and decks.
seed: 54321
device: cpu
output_dir: runs/ppo_self_play_v2

environment:
  backend: python_batch
  evaluation_backend: godot
  godot_path: null
  reward:
    capture: 0.0
    multi_capture: 0.0
    terminal: 2.0
    final_margin: 0.10
    final_margin_scale: 5.0
    board_control_delta: 0.05
    board_control_delta_limit: 4
  scenarios:
    - god: veskar
      deck: [devoracle_n3, griffe_a_jetons_n3, sou_ricanant_n3, croupier_manchot_n2, jumeau_de_cuivre_n2, valet_a_lenvers_n2, avortons_des_caves_n2, le_voyeur_n1]
    - god: nerava
      deck: [porte_fievre_n2, crache_cendre_n2, clochelet_malade_n2, machoire_moisie_n2, veuve_des_spores_n1, griffe_septique_n1, le_nud_hurlant_n1, devoreur_de_lanternes_n1]
    - god: kharun
      deck: [eclat_cuirasse_n2, heaume_errant_n2, carapace_vide_n2, osselet_blinde_n2, chevalier_sans_visage_n1, golem_de_faience_n1, avortons_des_caves_n2, le_sac_a_murmures_n2]
    - god: ilyr
      deck: [longuepine_n3, bouche_arbalete_n2, echassier_des_brumes_n3, veilleur_bifurque_n2, lil_empale_n1, la_croisee_des_regards_n1, avortons_des_caves_n3, le_voyeur_n1]
    - god: sylkha
      deck: [nud_vivant_n3, bourgeon_mordant_n3, mante_des_racines_n2, porte_nid_n2, fourmilion_des_nerfs_n1, la_nourrice_nouee_n1, avortons_des_caves_n2, devoreur_de_lanternes_n2]
    - god: enigma
      deck: [collecteur_de_dents_n4, depeceur_rampant_n4, recycleur_thoracique_n3, porte_greffes_n2, le_demonteur_n2, la_machine_aux_mille_depouilles_n1, avortons_des_caves_n3, le_voyeur_n1]

model:
  architecture: tactical_actor_critic
  action_hidden_dim: 128
  hidden_dim: 512

ppo:
  total_timesteps: 4194304
  rollout_steps: 32
  num_envs: 16
  learning_rate: 0.00010
  gamma: 0.99
  gae_lambda: 0.95
  minibatches: 8
  min_update_epochs: 1
  max_update_epochs: 4
  target_kl: 0.02
  update_epochs: 3
  clip_coef: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

monitoring:
  tensorboard: true
  checkpoint_every_updates: 25
  snapshot_every_updates: 200
  alerts:
    target_kl: 0.02
    maximum_clip_fraction: 0.30
    minimum_normalized_entropy: 0.08
    minimum_explained_variance: -0.10
    maximum_throughput_drop: 0.35
    maximum_eval_regression: 0.05
    maximum_reward_divergence: 0.25
    minimum_anchor_win_rate: 0.80
    plateau_evaluations: 5
    consecutive_updates: 3

# Shared PPO/profile state. Phase-5 admissions use phase5.promotion below.
curriculum:
  promotion_win_rate: 0.85
  confidence_floor: 0.90
  maximum_loss_rate: 0.07
  non_loss_confidence_floor: 0.90
  replay_probability: 0.20
  stages:
    - {name: precision_0, precision: 0.0, anticipation: false}
    - {name: precision_025, precision: 0.25, anticipation: false}
    - {name: precision_050, precision: 0.50, anticipation: false}
    - {name: precision_100, precision: 1.0, anticipation: false}
    - {name: precision_100_anticipation_25, precision: 1.0, anticipation_probability: 0.25}
    - {name: precision_100_anticipation_50, precision: 1.0, anticipation_probability: 0.50}
    - {name: precision_100_anticipation_75, precision: 1.0, anticipation_probability: 0.75}
    - {name: precision_100_anticipation, precision: 1.0, anticipation_probability: 1.0}
  god_sampling:
    enabled: false
  terrain_sampling:
    enabled: false

# Screening uses all 36 god pairings, both model roles and both first players.
evaluation:
  every_updates: 100
  num_envs: 10
  godot_retry_attempts: 2

# Three validated promotions; the last also needs independent final holdout.
phase5:
  protocol: champion_v1
  target_promotions: 3
  minimum_updates_between_attempts: 100
  maximum_updates_without_promotion: 1500
  maximum_history_anchors: 3
  seed_base: 6000000000000
  mirror_probability: 0.10
  training_weights: {current: 0.60, historical: 0.20, godot: 0.20}
  adaptive_opponents:
    initial_bot_fraction: 0.40
    minimum_bot_fraction: 0.25
    maximum_bot_fraction: 0.50
    adjustment: 0.05
    consecutive_results: 2
    every_updates: 100
    games_per_slice: 1
  screen_games_per_slice: 1
  screen_minimum_score: 0.52
  promotion:
    games_per_slice: 8
    confirmations: 2
    minimum_score: 0.53
    confidence_level: 0.95
    bootstrap_samples: 2000
    maximum_god_regression: 0.05
  history:
    games_per_slice: 2
    minimum_score: 0.48
    maximum_regression: 0.05
  retention:
    games_per_slice: 2
    maximum_stage_regression: 0.05
    maximum_god_regression: 0.08
  final:
    games_per_slice: 12
