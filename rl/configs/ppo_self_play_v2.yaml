# Phase 5: start only from a validated phase-4 checkpoint.
# The decks below are fixed presets. Training pairs different gods and decks.
seed: 54321
device: cpu
output_dir: runs/ppo_self_play_v2

environment:
  backend: python_batch
  evaluation_backend: godot
  godot_path: null
  reward:
    capture: 0.0
    multi_capture: 0.0
    terminal: 2.0
    final_margin: 0.10
    final_margin_scale: 5.0
    board_control_delta: 0.05
    board_control_delta_limit: 4
  scenarios:
    - god: veskar
      deck: [devoracle_n3, griffe_a_jetons_n3, sou_ricanant_n3, croupier_manchot_n2, jumeau_de_cuivre_n2, valet_a_lenvers_n2, avortons_des_caves_n2, le_voyeur_n1]
    - god: nerava
      deck: [porte_fievre_n2, crache_cendre_n2, clochelet_malade_n2, machoire_moisie_n2, veuve_des_spores_n1, griffe_septique_n1, le_nud_hurlant_n1, devoreur_de_lanternes_n1]
    - god: kharun
      deck: [eclat_cuirasse_n2, heaume_errant_n2, carapace_vide_n2, osselet_blinde_n2, chevalier_sans_visage_n1, golem_de_faience_n1, avortons_des_caves_n2, le_sac_a_murmures_n2]
    - god: ilyr
      deck: [longuepine_n3, bouche_arbalete_n2, echassier_des_brumes_n3, veilleur_bifurque_n2, lil_empale_n1, la_croisee_des_regards_n1, avortons_des_caves_n3, le_voyeur_n1]
    - god: sylkha
      deck: [nud_vivant_n3, bourgeon_mordant_n3, mante_des_racines_n2, porte_nid_n2, fourmilion_des_nerfs_n1, la_nourrice_nouee_n1, avortons_des_caves_n2, devoreur_de_lanternes_n2]
    - god: enigma
      deck: [collecteur_de_dents_n4, depeceur_rampant_n4, recycleur_thoracique_n3, porte_greffes_n2, le_demonteur_n2, la_machine_aux_mille_depouilles_n1, avortons_des_caves_n3, le_voyeur_n1]

model:
  hidden_dim: 512

ppo:
  total_timesteps: 4194304
  rollout_steps: 32
  num_envs: 16
  learning_rate: 0.00010
  gamma: 0.99
  gae_lambda: 0.95
  minibatches: 8
  min_update_epochs: 1
  max_update_epochs: 4
  target_kl: 0.02
  update_epochs: 3
  clip_coef: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

monitoring:
  tensorboard: true
  checkpoint_every_updates: 25
  snapshot_every_updates: 200
  alerts:
    target_kl: 0.02
    maximum_clip_fraction: 0.30
    minimum_normalized_entropy: 0.08
    minimum_explained_variance: -0.10
    maximum_throughput_drop: 0.35
    maximum_eval_regression: 0.05
    maximum_reward_divergence: 0.25
    minimum_anchor_win_rate: 0.80
    plateau_evaluations: 5
    consecutive_updates: 3

curriculum:
  promotion_win_rate: 0.85
  confidence_floor: 0.90
  maximum_loss_rate: 0.07
  non_loss_confidence_floor: 0.90
  replay_probability: 0.20
  god_sampling:
    enabled: false
  terrain_sampling:
    enabled: false

evaluation:
  every_updates: 100
  games: 500
  num_envs: 10
  seed_base: 2300000000
  anchor_games_per_stage: 0
  final_gate:
    games_per_slice: 100
    seed_base: 2100000000
    overall_win_rate: 0.85
    confidence_floor: 0.90
    maximum_loss_rate: 0.05
    non_loss_confidence_floor: 0.90
    minimum_slice_win_rate: 0.80
    maximum_slice_loss_rate: 0.10

phase5:
  activation: after_phase4_gate
  require_validated_phase4: true
  league_directory: runs/ppo_self_play_v2/league
  mirror_probability: 0.10
  mixed_eval_games_per_pair: 1
  mixed_eval_seed_base: 2350000000
  selection_mixed_weight: 0.70
  snapshot_every_updates: 100
  max_recent: 6
  weight_schedule:
    - until_update: 100
      weights: {current: 0.15, recent: 0.00, historical: 0.00, best: 0.05, godot: 0.80}
    - until_update: 500
      weights: {current: 0.30, recent: 0.10, historical: 0.05, best: 0.05, godot: 0.50}
    - until_update: 2147483647
      weights: {current: 0.40, recent: 0.20, historical: 0.10, best: 0.05, godot: 0.25}
  validation:
    minimum_updates: 500
    godot_games_per_slice: 12
    mixed_games_per_slice: 12
    godot_seed_base: 2400000000
    mixed_seed_base: 2500000000
    maximum_stage_regression: 0.05
    maximum_god_regression: 0.08
    minimum_head_to_head_score: 0.52
    minimum_head_to_head_wilson: 0.49
    minimum_god_score: 0.45
    minimum_matchup_score: 0.30
