name: Game quality

on:
  push:
    paths: ['game/**', '.github/workflows/game-quality.yml', '.gitignore', '.gitattributes']
  pull_request:
    paths: ['game/**', '.github/workflows/game-quality.yml', '.gitignore', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$GODOT_BIN"
      - name: Import, test and inspect release contents
        run: python game/tools/check_quality.py --import --export
      - name: Check authoring tools
        run: python -m unittest discover -s game/tools/tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-quality-logs
          path: .tmp/quality/*.log
          include-hidden-files: true
          retention-days: 7
